openapi: 3.0.3
info:
  title: FastAPI OpenVINO Text Inference API
  version: 0.1.0
  description: Contract for local text generation through a configured language model.
servers:
  - url: /
paths:
  /v1/generate:
    post:
      operationId: generateText
      summary: Generate text from an input text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequest'
      responses:
        '200':
          description: Text generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResult'
        '400':
          description: The request is syntactically valid but violates an input rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body is malformed or has an invalid field type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The service or model is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Generation exceeded the configured timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Controlled generation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /healthz:
    get:
      operationId: healthCheck
      summary: Check whether the process is alive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      operationId: readinessCheck
      summary: Check whether text generation is available
      responses:
        '200':
          description: Model and required configuration are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Process is alive but cannot generate text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  schemas:
    GenerationRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          description: Text to send to the configured language model.

    GenerationResult:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: Text generated by the configured language model.

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - not_ready
                - model_unavailable
                - generation_timeout
                - generation_failed
            message:
              type: string
            request_id:
              type: string

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive

    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        reason:
          type: string
          enum:
            - model_unavailable
            - invalid_configuration
            - model_load_failed
          description: Safe operational reason; no internal paths or traces.
