name: Ensure feature PR

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ensure-feature-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ensure-pr:
    name: ensure-feature-pr
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse PR to develop
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace(/^refs\/heads\//, '');
            const base = 'develop';

            if (!head.startsWith('feature/')) {
              core.setFailed(`Unexpected source branch: ${head}`);
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`
            });
            if (comparison.data.status === 'identical' || comparison.data.ahead_by === 0) {
              core.info(`No differences between ${head} and ${base}; no PR created.`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 100
            });
            if (existing.data.length > 0) {
              core.info(`Reusing PR #${existing.data[0].number} for ${head} -> ${base}.`);
              return;
            }

            const changedFiles = (comparison.data.files || [])
              .map(file => `- ${file.filename}`)
              .slice(0, 40);
            const specFiles = (comparison.data.files || [])
              .map(file => file.filename)
              .filter(filename => /(^|\/)specs?\//i.test(filename));
            const specSection = specFiles.length > 0
              ? specFiles.map(filename => '- `' + filename + '`').join('\n')
              : 'Nenhuma spec foi detectada no diff.';
            const titleName = head.replace(/^feature\//, '').replace(/-/g, ' ');
            const body = [
              '## Objetivo',
              'Integrar a feature `' + head + '` em `' + base + '`.',
              '',
              '## Mudanças',
              changedFiles.length > 0 ? changedFiles.join('\n') : '- Consulte o diff da branch.',
              '',
              '## Spec Kit',
              specSection,
              '',
              '## Verificações',
              '- PR criado por automação de metadados após push autorizado.',
              '- Os checks do GitHub Actions são executados separadamente neste PR.',
              '',
              'Origem: `' + head + '`',
              'Destino: `' + base + '`'
            ].join('\n');

            try {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title: `Feature: ${titleName}`,
                body
              });
              core.info(`Created PR #${created.data.number}: ${created.data.html_url}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const raced = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 100
              });
              if (raced.data.length === 0) throw error;
              core.info(`Another run created PR #${raced.data[0].number}; reusing it.`);
            }
