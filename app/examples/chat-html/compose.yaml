services:
  chat-example:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - app_default
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  app_default:
    external: true
